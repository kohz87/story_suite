<style>
  /* Offline copies of Nunito (same family as the Google link above) so shots match without network. */
  @font-face { font-family: "Nunito"; font-weight: 400 500; src: local("Nunito"), url(./fonts/nunito-latin-400.woff2) format("woff2"); }
  @font-face { font-family: "Nunito"; font-weight: 600; src: local("Nunito SemiBold"), url(./fonts/nunito-latin-600.woff2) format("woff2"); }
  @font-face { font-family: "Nunito"; font-weight: 700; src: local("Nunito Bold"), url(./fonts/nunito-latin-700.woff2) format("woff2"); }
  @font-face { font-family: "Nunito"; font-weight: 800 900; src: local("Nunito ExtraBold"), url(./fonts/nunito-latin-800.woff2) format("woff2"); }
  [data-portrait][style*="img/"] { background-size: cover; background-position: center 20%; color: transparent; }
  body { margin: 0; font-family: "Nunito", system-ui, sans-serif; background: #1b1d26; color: #eee; }
  .hx-bar { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; position: relative; z-index: 4000; }
  .hx-bar button { min-width: 44px; min-height: 44px; font-size: 14px; }
  .hx-frame { margin: 0 auto; position: relative; height: 80vh; transform: translateZ(0); overflow: hidden; }
</style>
</head>
<body>
<div id="hx-controls" class="hx-bar"></div>
<div id="hx-frame" class="hx-frame"></div>
<script type="module" src="./harness.js"></script>
</body>
