name: Story Suite CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch or pull request: a newer push cancels the run it replaces, so the account's
# runner slots go to current code. On main, the latest run tests the combined code; each PR run already checked its own diff.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install root dev dependencies
        run: npm ci
      # Check what this PR or push introduced; a bare `git diff --check` on a fresh checkout
      # compares a clean tree and never finds anything. The same bases feed the legacy-list ratchet;
      # a merge with no usable event base has several (every parent that has the list), one per line.
      - name: Choose the base commits
        id: base
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: bash scripts/ci/choose-base.sh
      - name: Diff check and size check (once per base)
        env:
          BASES: ${{ steps.base.outputs.bases }}
        run: |
          while read -r base; do
            [ -n "$base" ] || continue
            echo "== base $base"
            git diff --check "$base" HEAD
            node scripts/checks/run-size-check.mjs --base "$base"
          done <<< "$BASES"
      - name: Redraw copy is current
        run: node scripts/sync-redraw-copy.mjs --check
      - name: Codemap check
        run: node scripts/codemap/cli.mjs --check
      - name: Every package test file is run by its npm test
        run: node scripts/checks/package-test-globs.mjs
      - name: No tracked node_modules
        run: node scripts/checks/no-tracked-deps.mjs
      - name: Script tests
        # Same command as npm run test:scripts, plus a per-test timeout.
        run: node --test --test-timeout=900000 "tests/scripts/**/*.test.js"
      - name: Core tests
        # Same command as npm run test:core, plus a per-test timeout.
        run: node --test --test-timeout=900000 "tests/core/**/*.test.js"

  # Informational: a file a lane adds without a rule shows up here, and only this job fails.
  # The verify aggregate job must not list this job in needs.
  layout-dry-run:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Plan every layout area (no writes)
        run: npm run layout:plan

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install root dev dependencies
        run: npm ci
      - name: Install the browser for the rendered checks
        run: npx playwright install --with-deps chromium
      # CI=true makes a missing browser a failure, so the rendered sweeps never skip here.
      - name: UI tests
        # Same command as npm run test:ui, plus a per-test timeout.
        run: node --test --test-timeout=900000 "tests/ui/**/*.test.js" "tests/ui-gaps/*.test.js"

  # Story Block's tests run in three parallel shards (node --test-shard splits the test files round-robin, so
  # every file runs in exactly one shard). tests/scripts/ci-shards.test.js checks the shard list.
  story-block:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    defaults:
      run:
        working-directory: packages/story-block
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: npm run check
      # A pull request whose changed files are all inside the pack area runs only the pack
      # tests. Anything else (other files, a push to main, a manual run, no base to compare,
      # an empty list) runs the full suite. A pack-only run has few tests: shard 1/3 runs them and the
      # other shards do nothing, so every shard still reports a result.
      - name: Choose the test set
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          scope=full
          if [ "$EVENT" = "pull_request" ] && [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files="$(git diff --name-only --no-renames "$BASE" HEAD)"
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^packages/story-block/(examples/packs/|docs/v2/ERSVEIL\.md$|tests/v2/packs/)'; then
              scope=packs
            fi
          fi
          echo "Test set: $scope"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
      - name: Pack tests (pack-only change)
        if: steps.scope.outputs.scope == 'packs' && matrix.shard == '1/3'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          # Tests outside tests/v2/packs also read the example packs and the pack test helpers.
          # Both searches are recursive, so a test in a nested pack folder is run (once).
          packs="$(find tests/v2/packs -name '*.test.js' | sort)"
          others="$(grep -rliE 'examples/packs|packs/helpers|ersveil' tests --include='*.test.js' | grep -v '^tests/v2/packs/' | sort)"
          echo "Pack tests:"
          printf '%s\n' "$packs"
          echo "Also running the tests that read the example packs:"
          printf '%s\n' "$others"
          # shellcheck disable=SC2086
          node --test --test-timeout=900000 $packs $others
      - name: Behavioral tests
        if: steps.scope.outputs.scope != 'packs'
        env:
          FUZZ_DUMP_DIR: ${{ runner.temp }}
          NODE_OPTIONS: --max-old-space-size=4096
        # The same command and heap as Story Block's npm test, plus a per-test timeout (node ignores the flag
        # after the globs and refuses it in NODE_OPTIONS, so `npm test -- --test-timeout` cannot be used;
        # tests/scripts/ci-timeouts.test.js checks this command against package.json).
        run: node --test --test-timeout=900000 --test-shard=${{ matrix.shard }} "tests/*.test.js" "tests/v2/**/*.test.js" "examples/fishing/tests/*.test.js"
      - name: Keep state-fuzz replay dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: state-fuzz-replay-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/state-fuzz-*/mismatch.json
          if-no-files-found: ignore
          retention-days: 7

  story-director:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/story-director
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: npm run check
      - name: Behavioral tests
        # The same command as Story Director's npm test, plus a per-test timeout.
        run: node --test --test-timeout=900000 "tests/*.test.js" "tests/v2/**/*.test.js"

  npc-state-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/npc-state-delta
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('runtime-modules.json', 'utf8'));
          const modules = config.modules.map(item => item.path);
          if (!modules.length) throw new Error('runtime-modules.json contains no active modules');
          for (const file of modules) {
            require('node:child_process').execFileSync(process.execPath, ['--check', file], { stdio: 'inherit' });
          }
          NODE
      - name: Full verification
        # The same three commands as this package's npm test; the first runs many tests, so it gets a per-test timeout.
        run: |
          node --max-old-space-size=4096 --import ./tests/active-runtime-test-setup.mjs --test --test-timeout=900000 tests/*.test.js tests/v2/break/*.test.js
          node --max-old-space-size=4096 --import ./tests/active-runtime-test-setup.mjs tests/compatibility-check.js
          node --max-old-space-size=4096 --import ./tests/active-runtime-test-setup.mjs tests/runtime-smoke.mjs
      - name: Delta validation and prompt measurement
        run: |
          npm run validate
          npm run measure:prompts
      - name: Verify runtime package
        run: npm run package
      - name: Release consistency
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const runtime = JSON.parse(fs.readFileSync('runtime-modules.json', 'utf8'));
          const core = fs.readFileSync('core.js', 'utf8');
          const readme = fs.readFileSync('README.md', 'utf8');
          const rootJs = fs.readdirSync('.', { withFileTypes: true })
            .filter(entry => entry.isFile() && entry.name.endsWith('.js'))
            .map(entry => entry.name)
            .sort();
          const configured = runtime.modules.map(item => item.path).filter(item => !item.includes('/')).sort();
          if (manifest.version !== pkg.version) throw new Error(`version mismatch: manifest=${manifest.version} package=${pkg.version}`);
          if (runtime.applicationVersion !== manifest.version) throw new Error(`runtime inventory version mismatch: ${runtime.applicationVersion}`);
          if (runtime.entrypoint !== manifest.js) throw new Error(`runtime inventory entrypoint mismatch: ${runtime.entrypoint}`);
          if (JSON.stringify(rootJs) !== JSON.stringify(configured)) throw new Error('active runtime inventory does not exactly match root JS modules');
          if (!core.includes(`NPC_STATE_VERSION = '${manifest.version}'`)) throw new Error('core application version mismatch');
          if (!core.includes("./core-mechanics.js")) throw new Error('canonical core mechanics owner missing');
          if (!fs.readFileSync('branch.js', 'utf8').includes("./branch-core.js")) throw new Error('canonical branch core owner missing');
          if (configured.some(path => /(?:^|[-_.])legacy(?:[-_.]|$)|(?:^|[-_.])v\d{3,}(?:[-_.]|$)/i.test(path))) throw new Error('active runtime inventory contains legacy/version-labelled paths');
          if (!readme.startsWith(`# NPC State Delta v${manifest.version}`)) throw new Error('README title/version mismatch');
          if (manifest.js !== 'bootstrap.js' || !fs.readFileSync('bootstrap.js', 'utf8').includes("await import('./index.js')")) throw new Error('entrypoint mismatch');
          console.log(`Delta ${manifest.version}; ${configured.length} canonical active runtime modules`);
          NODE
          test -f "dist/npc_state_delta-$(node -p "require('./manifest.json').version").zip"
          unzip -l "dist/npc_state_delta-$(node -p "require('./manifest.json').version").zip"
      - name: Record reproducible verification source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git rev-parse HEAD > dist/verification-commit.txt
          git bundle create dist/verification-source.bundle HEAD
      - name: Retain verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delta-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            packages/npc-state-delta/dist/verification-commit.txt
            packages/npc-state-delta/dist/verification-source.bundle
            packages/npc-state-delta/dist/npc_state_delta-*.zip
          retention-days: 3
          if-no-files-found: error

  # The cross-package suite runs in two parallel shards; verify adds up their test counts against the floor.
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Story Block's rendered tests import "playwright"; Node finds it in the root node_modules.
      - name: Install the root packages (the browser package)
        run: npm ci
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: Cross-package suite tests (a skip fails the job)
        env:
          SUITE_SHARD: ${{ matrix.shard }}
          SUITE_COUNT_FILE: ${{ runner.temp }}/suite-count.txt
        run: bash scripts/ci/suite-tests.sh
      - name: Keep this shard's test count
        uses: actions/upload-artifact@v4
        with:
          name: suite-count-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/suite-count.txt
          if-no-files-found: error
          retention-days: 1

  # The one gate for branch protection: it passes only when every required job passed, and it adds up the
  # suite shards' test counts against the floor. Add a new required job to `needs` here. Informational jobs
  # (continue-on-error: true, such as layout-dry-run) stay out of `needs`.
  verify:
    if: ${{ always() }}
    needs: [rules, ui, story-block, story-director, npc-state-delta, suite]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every required job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "error: a required job ended as $r" >&2; exit 1; }
          done
      - uses: actions/checkout@v4
      - name: Collect the suite shards' test counts
        uses: actions/download-artifact@v4
        with:
          pattern: suite-count-*
          path: ${{ runner.temp }}/suite-counts
          merge-multiple: false
      - name: Suite test floor over all shards
        run: |
          mkdir "$RUNNER_TEMP/counts"
          # Folders are suite-count-<shard>-<attempt>; a re-run keeps earlier attempts' files, so the newest attempt per shard wins.
          for d in $(ls -d "$RUNNER_TEMP"/suite-counts/*/ | sort -V); do
            n="$(basename "$d")"; n="${n#suite-count-}"
            cp "$d/suite-count.txt" "$RUNNER_TEMP/counts/${n%-*}.txt"
          done
          bash scripts/ci/suite-floor.sh 2 "$RUNNER_TEMP/counts"
